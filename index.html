<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Pontix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">🚀 Pontix</h1>
    <button type="button" id="gear" aria-label="Settings">⚙</button>
  </header>

  <main id="view-main">
    <section class="balance data">
      <div class="label" id="balance-label"></div>
      <div class="value">⭐ <span id="balance">0</span> <small data-i18n="points"></small></div>
    </section>

    <div id="welcome" hidden>
      <section class="hero">
        <div class="langs" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="pt">PT</button>
        </div>
        <div class="hero-emoji" aria-hidden="true">🛏️ 🦷 📚 🧸 ➜ ⭐ ➜ 🎁</div>
        <h2 class="hero-title" data-i18n="heroTitle"></h2>
        <p class="hero-sub" data-i18n="heroSub"></p>
        <button type="button" class="cta" data-action="examples" data-i18n="ctaExamples"></button>
        <button type="button" class="cta-secondary" data-action="scratch" data-i18n="ctaScratch"></button>
        <p class="hero-note" data-i18n="heroNote"></p>
      </section>

      <section class="features">
        <h2 data-i18n="whyTitle"></h2>
        <div class="feature-grid">
          <div class="feature"><span class="ico">💸</span><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
          <div class="feature"><span class="ico">🔒</span><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
          <div class="feature"><span class="ico">👨‍👩‍👧</span><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
          <div class="feature"><span class="ico">🎯</span><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
          <div class="feature"><span class="ico">🎁</span><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></div>
          <div class="feature"><span class="ico">📊</span><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></div>
        </div>
      </section>

      <section>
        <h2 data-i18n="howTitle"></h2>
        <ol class="steps">
          <li data-i18n="welcomeStep1"></li>
          <li data-i18n="welcomeStep2"></li>
          <li data-i18n="welcomeStep3"></li>
        </ol>
      </section>

      <section class="final">
        <h2 class="final-title" data-i18n="finalTitle"></h2>
        <button type="button" class="cta" data-action="examples" data-i18n="ctaExamples"></button>
        <button type="button" class="cta-secondary" data-action="scratch" data-i18n="ctaScratch"></button>
      </section>
    </div>

    <section class="data">
      <h2 data-i18n="thisWeek"></h2>
      <div class="grid-wrap" id="grid-cur"></div>
    </section>

    <section class="data">
      <h2 data-i18n="lastWeek"></h2>
      <div class="grid-wrap" id="grid-prev"></div>
    </section>

    <section class="data">
      <h2 data-i18n="chartTitle"></h2>
      <div id="chart"></div>
    </section>

    <section class="data">
      <h2 data-i18n="rewards"></h2>
      <ul class="rewards" id="rewards"></ul>
    </section>

  </main>

  <main id="view-settings" hidden>
    <section>
      <h2 data-i18n="child"></h2>
      <div class="add-form">
        <input id="kid" maxlength="30" autocomplete="off">
      </div>
      <h3 data-i18n="theme"></h3>
      <div id="themes" class="seg">
        <button type="button" data-th="blue" aria-pressed="true"><i></i><span data-i18n="blue"></span></button>
        <button type="button" data-th="pink" aria-pressed="false"><i></i><span data-i18n="pink"></span></button>
      </div>
      <h3 data-i18n="appearance"></h3>
      <div id="modes" class="seg">
        <button type="button" data-md="system" aria-pressed="true" data-i18n="system"></button>
        <button type="button" data-md="light" aria-pressed="false" data-i18n="light"></button>
        <button type="button" data-md="dark" aria-pressed="false" data-i18n="dark"></button>
      </div>
      <h3 data-i18n="language"></h3>
      <select id="lang">
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </section>

    <section>
      <h2 data-i18n="tasks"></h2>
      <ul class="edit-list" id="edit-tasks"></ul>
      <form id="add-task" class="add-form">
        <input name="n" required maxlength="60" data-i18n-ph="taskName">
        <input name="p" type="number" min="1" step="1" value="1" inputmode="numeric" class="cost" data-i18n-aria="pointsPerTap">
        <button type="submit" data-i18n="add"></button>
      </form>
    </section>

    <section>
      <h2 data-i18n="rewards"></h2>
      <ul class="edit-list" id="edit-rewards"></ul>
      <form id="add-reward" class="add-form">
        <input name="n" required maxlength="60" data-i18n-ph="rewardName">
        <input name="c" type="number" required min="1" step="1" inputmode="numeric" class="cost" data-i18n-ph="cost">
        <button type="submit" data-i18n="add"></button>
      </form>
    </section>

    <button type="button" id="reset" class="danger" data-i18n="reset"></button>
  </main>

  <footer>
    <p class="hint" data-i18n="shareHint"></p>
    <button id="share" class="primary" data-i18n="share"></button>
  </footer>

  <div id="toast" role="status"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
